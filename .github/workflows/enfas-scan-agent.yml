name: Build ENFAS Scan Agent

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agenda-premium
    paths:
      - 'tools/enfas-scan-agent/**'

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tools/enfas-scan-agent/Enfas.Scan.Agent.csproj

      - name: Publish
        run: dotnet publish tools/enfas-scan-agent/Enfas.Scan.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/enfas-scan-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enfas-scan-agent-win-x64
          path: artifacts/enfas-scan-agent
