name: Premium CI

on:
  push:
    branches:
      - feature/agenda-premium
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: PHP syntax sanity
        run: find app routes database tests config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run migrations
        run: php artisan migrate --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Laravel route sanity
        run: |
          php artisan route:list --name=dashboard
          php artisan route:list --name=enfas.whatsapp
          php artisan route:list --name=agenda.best-slots
          php artisan route:list --name=appointments.record
          php artisan route:list --name=clinical-profile
          php artisan route:list --name=clinical-workflow
          php artisan route:list --name=clinical-prescriptions
          php artisan route:list --name=clinical-attachments.ocr
